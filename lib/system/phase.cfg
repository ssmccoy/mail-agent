# Trusted launcher domain. Workload domains are restricted again by the driver.
unrestricted-network
ro /etc/hosts
ro /etc/resolv.conf
ro /etc/nsswitch.conf
ro /etc/passwd
ro /etc/group
ro /etc/ssl
ro /etc/ld.so.cache
rox /usr
rox /bin
rox /lib
ro /proc
rw /dev/null
rw /dev/urandom
ro /etc/mail-agent
ro "$MAIL_AGENT_SYSTEM_INPUT"
rw "$MAIL_AGENT_SYSTEM_OUTPUT"
rwx "$STATE_DIRECTORY"
rwx "$RUNTIME_DIRECTORY"
rwx "$MAIL_AGENT_SYSTEM_SHARED"
ro "$MAIL_AGENT_SHARED_STATE"
rw "$MAIL_AGENT_AUTH"
rox "$MAIL_AGENT_EXECUTABLE"
rox "$MAIL_AGENT_PACKAGES"
rox "$MAIL_AGENT_TOOLCHAIN"
ro "$MAIL_AGENT_TOOLCHAIN_CONFIG"
ro "$MAIL_AGENT_GIT_CONFIG"
ro "$MAIL_AGENT_INSTRUCTIONS"
rw "$MAIL_AGENT_GO_CACHE"

env HOME
env PATH
env STATE_DIRECTORY
env RUNTIME_DIRECTORY
env INVOCATION_ID
env SERVICE_RESULT
env EXIT_CODE
env EXIT_STATUS
env MAIL_AGENT_SYSTEM_POLICY
env MAIL_AGENT_SYSTEM_SESSION
env MAIL_AGENT_SYSTEM_STAGE
env MAIL_AGENT_SYSTEM_INPUT
env MAIL_AGENT_SYSTEM_OUTPUT
env MAIL_AGENT_SYSTEM_PROJECT
env MAIL_AGENT_SYSTEM_SHARED
env MAIL_AGENT_SYSTEM_DRIVER
env MAIL_AGENT_SYSTEM_MODE
env MAIL_AGENT_SYSTEM_REQUEST
env MAIL_AGENT_LIB
env MAIL_AGENT_BIN
env MAIL_AGENT_CONFIG
env MAIL_AGENT_PROFILES
env MAIL_AGENT_LANDLOCK
env MAIL_AGENT_EXECUTABLE
env MAIL_AGENT_PACKAGES
env MAIL_AGENT_SHARED_STATE
env MAIL_AGENT_AUTH
env MAIL_AGENT_TOOLCHAIN
env MAIL_AGENT_TOOLCHAIN_CONFIG
env MAIL_AGENT_EXEC_PATH
env MAIL_AGENT_GO_CACHE
env MAIL_AGENT_GIT_CONFIG
env MAIL_AGENT_INSTRUCTIONS
env MAIL_AGENT_OUTPUT_DIR
env GIT_CONFIG_NOSYSTEM
env GIT_CONFIG_GLOBAL
env GIT_TERMINAL_PROMPT
env GIT_AUTHOR_NAME
env GIT_AUTHOR_EMAIL
env GIT_COMMITTER_NAME
env GIT_COMMITTER_EMAIL
