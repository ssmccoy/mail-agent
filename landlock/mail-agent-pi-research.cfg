# Research permits runtime state and private temporary writes only.
# The caller supplies MAIL_AGENT_RESEARCH_TMP for this turn.

env HOME
env MAIL_AGENT_LIB
env MAIL_AGENT_CONFIG
env MAIL_AGENT_BIN
ro "$MAIL_AGENT_LIB"
env PI_CODING_AGENT_DIR="$MAIL_AGENT_DRIVER_HOME"
env UID
env TERM=dumb
env PATH="$MAIL_AGENT_EXEC_PATH"
env TMPDIR="$MAIL_AGENT_RESEARCH_TMP"
env TMPPREFIX="$MAIL_AGENT_RESEARCH_TMP"
ro /etc/hosts
ro /etc/ld.so.cache
ro /etc/localtime
ro /etc/nsswitch.conf
ro /etc/passwd
ro /etc/resolv.conf
ro /etc/ssl
ro /etc/alternatives
rox /bin
rox /lib
rox /usr/bin
rox /usr/libexec
ro /usr/share
ro /proc
rw /dev/null
rw /dev/urandom
rox "$MAIL_AGENT_EXECUTABLE"
rox "$MAIL_AGENT_PACKAGES"
rw "$MAIL_AGENT_DRIVER_HOME"
ro "$MAIL_AGENT_INSTRUCTIONS"
ro "$MAIL_AGENT_CONFIG"
rw "$MAIL_AGENT_RESEARCH_TMP"
rox .
connect-tcp 8080
connect-tcp 443
