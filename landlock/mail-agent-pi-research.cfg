# Research permits runtime state and private temporary writes only.
# The caller supplies MAIL_AGENT_RESEARCH_TMP for this turn.

env HOME
env PI_CODING_AGENT_DIR="$MAIL_AGENT_DRIVER_HOME"
env UID
env TERM=dumb
env PATH="$HOME/.proto/shims:$HOME/.proto/bin:/usr/bin"
env TMPDIR="$MAIL_AGENT_RESEARCH_TMP"
env TMPPREFIX="$MAIL_AGENT_RESEARCH_TMP"
ro /etc/hosts
ro /etc/ld.so.cache
ro /etc/localtime
ro /etc/nsswitch.conf
ro /etc/passwd
ro /etc/resolv.conf
ro /etc/ssl
ro /etc/alternatives
rox /bin
rox /lib
rox /usr/bin
rox /usr/libexec
ro /usr/share
ro /proc
rw /dev/null
rw /dev/urandom
rox ~/.local/bin/pi
rox ~/.local/lib/node_modules/@earendil-works/pi-coding-agent
rw "$MAIL_AGENT_DRIVER_HOME"
ro ~/.claude/CLAUDE.md
ro ~/.config/mail-agent
rw "$MAIL_AGENT_RESEARCH_TMP"
rox .
connect-tcp 8080
connect-tcp 443
