# Landlock profile for the email agent, codex side.
#
# The agent gets its own CLAUDE_CONFIG_DIR, a writable working directory
# (the cwd, so run it from ~/mail/.agent/work/<uuid>), and read-only
# access to whichever repository the caller passes with -r. Nothing
# else: no ssh keys, no gh or kube or teleport credentials, no access
# to the interactive session's transcripts.

env HOME
env UID
env TERM=dumb
env PATH="/usr/bin"
env TMPDIR=/tmp/mail-agent
env CODEX_TMPDIR=/tmp/mail-agent

# zsh writes here documents under TMPPREFIX, not TMPDIR, and a shell
# that cannot write one cannot run a heredoc at all.
env TMPPREFIX=/tmp/mail-agent/zsh
env CODEX_HOME="$HOME/mail/.agent/codex"

dir /tmp/mail-agent
dir /tmp/mail-agent/zsh

# Due to WSL
best-effort

ro /etc/hosts
ro /etc/ld.so.cache
ro /etc/localtime
ro /etc/nsswitch.conf
ro /etc/passwd
ro /etc/resolv.conf
ro /etc/ssl
ro /etc/alternatives

rox /bin
rox /lib
rox /usr/bin
rox /usr/libexec
ro /usr/share
rwx /proc
rw /dev/null
rw /dev/urandom

# The agent binary itself, which is where the launcher symlink points.
rox ~/.local/bin/codex
rox ~/.codex/packages

# Session state for this agent only. The credentials file is a symlink
# into ~/.codex so that a refreshed token is written in one place.
rw ~/mail/.agent/codex
rw ~/.codex/auth.json

# The sender's own instructions, and no more of ~/.codex than that.
ro ~/.claude/CLAUDE.md

# Committer identity, and the agent's own settings and step program.
ro ~/.config/git
ro ~/.config/mail-agent

rwx /tmp/mail-agent
rwx .

connect-tcp 443
