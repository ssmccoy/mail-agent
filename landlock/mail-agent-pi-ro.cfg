# Landlock profile for the email agent, pi side.
#
# The agent gets a writable working directory (the cwd, so run it from
# ~/mail/.agent/work/<uuid>), read-only access to whichever repository
# the caller passes with -r, and a route to the local model server.
# Nothing else: no ssh keys, no gh or kube or teleport credentials, no
# access to the interactive session's transcripts.

env HOME
env UID
env TERM=dumb
env PATH="$HOME/.proto/shims:$HOME/.proto/bin:/usr/bin"

# Go writes to GOPATH whether or not it is set, and the default is a
# directory the sandbox denies, so a turn that builds anything spends
# itself discovering that. Point the caches at one writable place,
# shared by every thread so a second thread on the same repository does
# not download the module graph again.
env GOPATH="$HOME/mail/.agent/go"
env GOMODCACHE="$HOME/mail/.agent/go/pkg/mod"
env GOCACHE="$HOME/mail/.agent/go/cache"
env GOFLAGS=-mod=mod
env TMPDIR=/tmp/mail-agent

# zsh writes here documents under TMPPREFIX, not TMPDIR, and a shell
# that cannot write one cannot run a heredoc at all.
env TMPPREFIX=/tmp/mail-agent/zsh

dir /tmp/mail-agent
dir /tmp/mail-agent/zsh
dir ~/mail/.agent/go/pkg/mod
dir ~/mail/.agent/go/cache


ro /etc/hosts
ro /etc/ld.so.cache
ro /etc/localtime
ro /etc/nsswitch.conf
ro /etc/passwd
ro /etc/resolv.conf
ro /etc/ssl
ro /etc/alternatives

rox /bin
rox /lib
rox /usr/bin
rox /usr/libexec
ro /usr/share
ro /proc
rw /dev/null
rw /dev/urandom

# The launcher symlink and the npm install it resolves into: pi is a
# node script that loads the rest of the package at runtime, so the
# whole tree has to be readable and executable.
rox ~/.local/bin/pi
rox ~/.local/lib/node_modules/@earendil-works/pi-coding-agent

# pi's home: settings, the model catalog it caches, and the extension
# that teaches it the local provider. Shared by every thread.
rw ~/.pi

# The sender's own instructions, shared the same way and no more of
# ~/.claude than that.
ro ~/.claude/CLAUDE.md

# Keep shared Git objects, refs, and indexes read-only in this mode.
ro ~/mail/.agent/repos

# The toolchains proto manages, and the caches the build writes.
rox ~/.proto
ro ~/.prototools
rw ~/mail/.agent/go

# Committer identity, and the agent's own settings and step program.
ro ~/.config/git
ro ~/.config/mail-agent

rwx /tmp/mail-agent
rox .

# The local model server, not the internet.
connect-tcp 8080
