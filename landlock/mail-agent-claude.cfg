# Landlock profile for the email agent.
#
# The agent gets its own CLAUDE_CONFIG_DIR, a writable working directory
# (the cwd, so run it from ~/mail/.agent/work/<uuid>), and read-only
# access to whichever repository the caller passes with -r. Nothing
# else: no ssh keys, no gh or kube or teleport credentials, no access
# to the interactive session's transcripts.

env HOME
env MAIL_AGENT_LIB
env MAIL_AGENT_CONFIG
env MAIL_AGENT_BIN
ro "$MAIL_AGENT_LIB"
env UID
env TERM=dumb
env PATH="$MAIL_AGENT_EXEC_PATH"

# Go writes to GOPATH whether or not it is set, and the default is a
# directory the sandbox denies, so a turn that builds anything spends
# itself discovering that. Point the caches at one writable place,
# shared by every thread so a second thread on the same repository does
# not download the module graph again.
env GOPATH="$MAIL_AGENT_GO_CACHE"
env GOMODCACHE="$MAIL_AGENT_GO_CACHE/pkg/mod"
env GOCACHE="$MAIL_AGENT_GO_CACHE/cache"
env GOFLAGS=-mod=mod
env TMPDIR="$MAIL_AGENT_TMP"
env CLAUDE_CODE_TMPDIR="$MAIL_AGENT_TMP"

# zsh writes here documents under TMPPREFIX, not TMPDIR, and a shell
# that cannot write one cannot run a heredoc at all.
env TMPPREFIX="$MAIL_AGENT_TMP/zsh"
env CLAUDE_CONFIG_DIR="$MAIL_AGENT_DRIVER_HOME"

dir "$MAIL_AGENT_TMP"
dir "$MAIL_AGENT_TMP/zsh"
dir "$MAIL_AGENT_GO_CACHE/pkg/mod"
dir "$MAIL_AGENT_GO_CACHE/cache"

# Due to WSL
best-effort

ro /etc/hosts
ro /etc/ld.so.cache
ro /etc/localtime
ro /etc/nsswitch.conf
ro /etc/passwd
ro /etc/resolv.conf
ro /etc/ssl
ro /etc/alternatives

rox /bin
rox /lib
rox /usr/bin
rox /usr/libexec
ro /usr/share
rwx /proc
rw /dev/null
rw /dev/urandom

# The agent binary itself.
rox "$MAIL_AGENT_EXECUTABLE"
rox "$MAIL_AGENT_PACKAGES"

# Session state for this agent only. The credentials file is a symlink
# into ~/.claude so that OAuth refreshes stay in one place.
rw "$MAIL_AGENT_DRIVER_HOME"

# The sender's own instructions, shared the same way and no more of
# ~/.claude than that.
ro "$MAIL_AGENT_INSTRUCTIONS"

# The thread's checkout is a worktree, so its objects, refs and index
# live in the clone shared by every thread on that repository.

# The toolchains proto manages, and the caches the build writes.
rox "$MAIL_AGENT_TOOLCHAIN"
ro "$MAIL_AGENT_TOOLCHAIN_CONFIG"
rw "$MAIL_AGENT_GO_CACHE"

# Committer identity, and the agent's own settings and step program.
ro "$MAIL_AGENT_GIT_CONFIG"
ro "$MAIL_AGENT_CONFIG"

rwx "$MAIL_AGENT_TMP"
rwx .

connect-tcp 443
