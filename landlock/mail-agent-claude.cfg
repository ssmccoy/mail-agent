# Landlock profile for the email agent.
#
# The agent gets its own CLAUDE_CONFIG_DIR, a writable working directory
# (the cwd, so run it from ~/mail/.agent/work/<uuid>), and read-only
# access to whichever repository the caller passes with -r. Nothing
# else: no ssh keys, no gh or kube or teleport credentials, no access
# to the interactive session's transcripts.

env HOME
env UID
env TERM=dumb
env PATH="/usr/bin"
env TMPDIR=/tmp/mail-agent
env CLAUDE_CODE_TMPDIR=/tmp/mail-agent

# zsh writes here documents under TMPPREFIX, not TMPDIR, and a shell
# that cannot write one cannot run a heredoc at all.
env TMPPREFIX=/tmp/mail-agent/zsh
env CLAUDE_CONFIG_DIR="$HOME/mail/.agent/claude"

dir /tmp/mail-agent
dir /tmp/mail-agent/zsh

# Due to WSL
best-effort

ro /etc/hosts
ro /etc/ld.so.cache
ro /etc/localtime
ro /etc/nsswitch.conf
ro /etc/passwd
ro /etc/resolv.conf
ro /etc/ssl
ro /etc/alternatives

rox /bin
rox /lib
rox /usr/bin
rox /usr/libexec
ro /usr/share
rwx /proc
rw /dev/null
rw /dev/urandom

# The agent binary itself.
rox ~/.local/bin/claude
rox ~/.local/share/claude

# Session state for this agent only. The credentials file is a symlink
# into ~/.claude so that OAuth refreshes stay in one place.
rw ~/mail/.agent/claude
rw ~/.claude/.credentials.json

# The sender's own instructions, shared the same way and no more of
# ~/.claude than that.
ro ~/.claude/CLAUDE.md

# Committer identity, and the agent's own settings and step program.
ro ~/.config/git
ro ~/.config/mail-agent

rwx /tmp/mail-agent
rwx .

connect-tcp 443
